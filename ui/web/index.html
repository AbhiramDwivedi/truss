<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truss</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/cards.css">
  <link rel="stylesheet" href="/panels.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to the page content</a>
  <header id="app-header" class="app-header"></header>
  <nav class="jump" aria-label="Jump to a panel">
    <a href="#decisions-panel">Decisions and ADRs</a>
    <a href="#design-panel">Design</a>
  </nav>
  <main id="main" class="layout" tabindex="-1">
    <section id="notices" class="notices" aria-label="Notices"></section>
    <div class="col col-main">
      <section id="cards-region" class="region" aria-label="Goal and requests"></section>
      <section id="transcript" class="region" aria-label="Conversation"></section>
    </div>
    <div class="col col-side">
      <section id="crews" class="region" aria-labelledby="crews-heading"></section>
      <section id="retro" class="region" aria-label="Retro stage" hidden></section>
      <section id="panels" class="region" aria-label="Decisions and design"></section>
    </div>
  </main>
</body>
</html>
